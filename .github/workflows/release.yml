# Release: push a tag vX.Y.Z -> vet + tests -> build with the version from the tag ->
# SHA-256 -> build provenance attestation -> GitHub Release with zapret-manager.exe.
# The release is created with the gh CLI preinstalled on the runner, not with a
# third-party action. Actions are pinned by commit SHA (Dependabot updates them).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # toolchain directive pins the patched Go release
          cache: false            # a release build must not consume a cache other workflows can write

      - name: version from tag
        id: ver
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Output "tag must look like v1.2.3, got: $env:TAG"; exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: vet and test
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./...

      - name: build
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.appVersion=$env:VERSION" -o dist/zapret-manager.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $got = (& dist/zapret-manager.exe version)
          if ($got -ne "zapret-manager $env:VERSION") { Write-Output "version mismatch: $got"; exit 1 }
          $hash = (Get-FileHash dist/zapret-manager.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/zapret-manager.exe.sha256", "$hash  zapret-manager.exe`n")
          Get-Content dist/zapret-manager.exe.sha256

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/zapret-manager.exe

      - name: publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = (Get-Content -Raw -Encoding utf8 .github/release-notes.md).Replace('{{REPO}}', $env:GITHUB_REPOSITORY)
          [IO.File]::WriteAllText("$PWD/dist/notes.md", $notes)
          gh release create $env:TAG dist/zapret-manager.exe dist/zapret-manager.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY --verify-tag `
            --title "zapret-manager $env:TAG" --notes-file dist/notes.md --generate-notes
